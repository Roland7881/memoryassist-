<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-app-region: no-drag; }
  html, body { width: 320px; height: 180px; background: transparent; overflow: hidden; }

  #root {
    width: 320px; height: 180px;
    background: rgba(8, 8, 16, 0.82);
    border: 1px solid rgba(100, 80, 160, 0.55);
    border-radius: 10px;
    backdrop-filter: blur(6px);
    display: flex; flex-direction: column; gap: 8px; padding: 8px 10px 10px;
    font-family: "Segoe UI", sans-serif;
  }

  /* drag handle */
  #bar {
    display: flex; align-items: center; justify-content: space-between;
    cursor: grab; -webkit-app-region: drag; user-select: none;
    height: 18px;
  }
  #bar span { font-size: .65rem; letter-spacing: .1em; color: #8890cc; text-transform: uppercase; }
  #closeBtn {
    -webkit-app-region: no-drag; cursor: pointer;
    font-size: .75rem; color: #664; background: none; border: none; padding: 0 2px;
    line-height: 1; transition: color .15s;
  }
  #closeBtn:hover { color: #f66; }

  /* sequence strip */
  #strip { display: flex; gap: 5px; }
  .slot {
    width: 46px; height: 46px; border-radius: 5px;
    border: 1.5px solid #222230; background: #0d0d1a;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; position: relative;
    transition: border-color .2s, background .2s, box-shadow .2s;
    flex-shrink: 0;
  }
  .slot .n  { position: absolute; top: 2px; left: 4px; font-size: .52rem; color: #444; }
  .slot img { width: 24px; height: 24px; opacity: 0; transition: opacity .25s; }
  .slot .lb { font-size: .48rem; text-transform: uppercase; color: #555; opacity: 0; transition: opacity .25s; }
  .slot.filled { border-color: var(--c); background: color-mix(in srgb,var(--c) 14%,#0d0d1a); box-shadow: 0 0 8px color-mix(in srgb,var(--c) 30%,transparent); }
  .slot.filled img, .slot.filled .lb { opacity: 1; }
  .slot.filled .lb { color: var(--c); }

  /* buttons row */
  #btns { display: flex; gap: 5px; align-items: center; }
  .sbtn {
    width: 42px; height: 42px; border-radius: 6px; cursor: pointer;
    border: 1.5px solid var(--c); background: color-mix(in srgb,var(--c) 10%,#0d0d1a);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    transition: background .12s, box-shadow .12s, opacity .12s; padding: 0;
  }
  .sbtn:hover:not(:disabled) { background: color-mix(in srgb,var(--c) 26%,#0d0d1a); box-shadow: 0 0 8px color-mix(in srgb,var(--c) 40%,transparent); }
  .sbtn:disabled { opacity: .25; cursor: default; }
  .sbtn img  { width: 22px; height: 22px; pointer-events: none; }
  .sbtn span { font-size: .46rem; text-transform: uppercase; color: var(--c); letter-spacing: .04em; pointer-events: none; }

  #resetBtn {
    flex: 1; height: 42px; border-radius: 6px; cursor: pointer;
    border: 1.5px solid #553; background: #190f0f; color: #f77;
    font-size: .62rem; letter-spacing: .06em; text-transform: uppercase;
    transition: background .12s, border-color .12s;
  }
  #resetBtn:hover { background: #281010; border-color: #f44; }

  #dot {
    width: 7px; height: 7px; border-radius: 50%; background: #444;
    transition: background .3s; flex-shrink: 0;
  }
  #dot.ok  { background: #4caf50; box-shadow: 0 0 5px #4caf50; }
  #dot.err { background: #f44336; }

  #role-badge {
    font-size: .5rem; padding: 1px 5px; border-radius: 10px;
    background: #0d0d1a; border: 1px solid #334; color: #556;
    text-transform: uppercase; letter-spacing: .05em;
  }
  #role-badge.leader { border-color: #6655cc; color: #aab8ff; }
  #settingsBtn {
    -webkit-app-region: no-drag; cursor: pointer;
    font-size: .72rem; color: #446; background: none; border: none; padding: 0 2px;
    line-height: 1; transition: color .15s;
  }
  #settingsBtn:hover { color: #aab8ff; }

  #setup-modal {
    position: absolute; inset: 0; z-index: 100;
    background: rgba(8,8,16,0.97); border-radius: 10px;
    display: none; flex-direction: column; gap: 9px;
    padding: 12px 14px; justify-content: center;
  }
  #setup-modal h2 { font-size: .68rem; letter-spacing: .12em; color: #aab8ff; text-transform: uppercase; }
  #setup-modal label { display: flex; flex-direction: column; gap: 3px; font-size: .58rem; color: #8890cc; }
  #setup-modal input {
    background: #0d0d1a; border: 1px solid #334; color: #ddd; border-radius: 4px;
    padding: 4px 7px; font-size: .66rem; outline: none;
  }
  #setup-modal input:focus { border-color: #7766cc; }
  #setup-modal input.invalid { border-color: #f44336; }
  #setup-modal .hint { font-size: .5rem; color: #556; }
  #cfg-save {
    margin-top: 2px; padding: 5px 8px; border-radius: 5px; cursor: pointer;
    background: #3a2a7a; border: 1px solid #6655cc; color: #ccc;
    font-size: .62rem; text-transform: uppercase; letter-spacing: .08em;
    transition: background .12s;
  }
  #cfg-save:hover { background: #4a3a8a; }
</style>
</head>
<body>
<div id="root">
  <div id="bar">
    <span>&#9670; Memory Assist</span>
    <div style="display:flex;align-items:center;gap:6px">
      <span id="role-badge">viewer</span>
      <div id="dot" title="Server status"></div>
      <button id="settingsBtn" title="Settings">&#9881;</button>
      <button id="closeBtn" title="Close">&#10005;</button>
    </div>
  </div>

  <div id="setup-modal">
    <h2>&#9670; Configure</h2>
    <label>Room ID
      <input id="cfg-room" type="text" placeholder="e.g. group1" maxlength="50" spellcheck="false">
    </label>
    <label>Leader Key <span class="hint">(blank = view only)</span>
      <input id="cfg-key" type="password" placeholder="Optional">
    </label>
    <button id="cfg-save">Save &amp; Connect</button>
  </div>

  <div id="strip">
    <div class="slot" id="s1"><span class="n">1</span><img src="" alt=""><span class="lb"></span></div>
    <div class="slot" id="s2"><span class="n">2</span><img src="" alt=""><span class="lb"></span></div>
    <div class="slot" id="s3"><span class="n">3</span><img src="" alt=""><span class="lb"></span></div>
    <div class="slot" id="s4"><span class="n">4</span><img src="" alt=""><span class="lb"></span></div>
    <div class="slot" id="s5"><span class="n">5</span><img src="" alt=""><span class="lb"></span></div>
  </div>

  <div id="btns"></div>
</div>

<script>
const { ipcRenderer } = require('electron');
const path = require('path');

// Convert absolute path to a file:// URL Electron can load as an img src
function imgUrl(file) {
    return 'file:///' + path.join(__dirname, file).replace(/\\/g, '/');
}

const SHAPES = [
  { name:'TRIANGLE', color:'#66ff88', img: imgUrl('Triangle.png') },
  { name:'DIAMOND',  color:'#ffd933', img: imgUrl('diamond.png')  },
  { name:'T',        color:'#cc80ff', img: imgUrl('T.png')        },
  { name:'CIRCLE',   color:'#66ccff', img: imgUrl('circle.png')   },
  { name:'X',        color:'#ff4d4d', img: imgUrl('x.png')        },
];
const MAP      = Object.fromEntries(SHAPES.map(s=>[s.name,s]));
const RAW_BASE = 'https://memoryassist.onrender.com';
const ROOM_RE  = /^[a-zA-Z0-9_-]{1,50}$/;

// ── Config (persisted in localStorage) ──────────────────────────────────────
const modal     = document.getElementById('setup-modal');
const cfgRoomEl = document.getElementById('cfg-room');
const cfgKeyEl  = document.getElementById('cfg-key');
const roleBadge = document.getElementById('role-badge');

function loadCfg()         { return { room: localStorage.getItem('ma_room')||'', key: localStorage.getItem('ma_key')||'' }; }
function saveCfg(room,key) { localStorage.setItem('ma_room',room); localStorage.setItem('ma_key',key); }

let cfg = loadCfg();
let es  = null;

function openModal()  { cfgRoomEl.value=cfg.room; cfgKeyEl.value=cfg.key; modal.style.display='flex'; }
function closeModal() { modal.style.display='none'; }

if (!cfg.room) openModal(); else closeModal();

document.getElementById('settingsBtn').addEventListener('click', openModal);
document.getElementById('closeBtn').addEventListener('click', () => ipcRenderer.send('quit'));

document.getElementById('cfg-save').addEventListener('click', () => {
    const room = cfgRoomEl.value.trim();
    const key  = cfgKeyEl.value.trim();
    if (!ROOM_RE.test(room)) { cfgRoomEl.classList.add('invalid'); cfgRoomEl.focus(); return; }
    cfgRoomEl.classList.remove('invalid');
    cfg = { room, key };
    saveCfg(room, key);
    closeModal();
    updateButtonState();
    reconnect();
});

// ── Buttons ──────────────────────────────────────────────────────────────────
const btns  = document.getElementById('btns');
const dot   = document.getElementById('dot');
const slots = [1,2,3,4,5].map(i=>document.getElementById('s'+i));

SHAPES.forEach(s=>{
  const b = document.createElement('button');
  b.className='sbtn'; b.id='ob_'+s.name;
  b.style.setProperty('--c', s.color);
  b.innerHTML = `<img src="${s.img}"><span>${s.name}</span>`;
  b.addEventListener('click', ()=>{
    fetch(RAW_BASE+'/add?room='+encodeURIComponent(cfg.room), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ shape: s.name, leaderKey: cfg.key || undefined })
    }).catch(()=>{});
  });
  btns.appendChild(b);
});
const rb = document.createElement('button');
rb.id='resetBtn'; rb.textContent='Reset';
rb.addEventListener('click', ()=>{
  fetch(RAW_BASE+'/reset?room='+encodeURIComponent(cfg.room), {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ leaderKey: cfg.key || undefined })
  }).catch(()=>{});
});
btns.appendChild(rb);

function updateButtonState() {
    const leader = !!cfg.key;
    btns.querySelectorAll('button').forEach(b => { b.disabled = !leader; });
    roleBadge.textContent = leader ? 'leader' : 'viewer';
    roleBadge.className   = leader ? 'leader' : '';
}
updateButtonState();

function render(seq){
  SHAPES.forEach(s=>{ const b=document.getElementById('ob_'+s.name); if(b) b.disabled = !cfg.key || seq.includes(s.name); });
  slots.forEach((el,i)=>{
    const info = MAP[seq[i]];
    if(info){
      el.style.setProperty('--c', info.color);
      el.querySelector('img').src = info.img;
      el.querySelector('.lb').textContent = seq[i];
      el.classList.add('filled');
    } else {
      el.style.removeProperty('--c');
      el.querySelector('img').src = '';
      el.querySelector('.lb').textContent = '';
      el.classList.remove('filled');
    }
  });
}

function connect(){
  if (es) { try { es.close(); } catch(_){} es = null; }
  if (!cfg.room) return;
  es = new EventSource(RAW_BASE+'/events?room='+encodeURIComponent(cfg.room));
  es.onopen    = ()=>{ dot.className='ok'; };
  es.onmessage = e=>{ const m=JSON.parse(e.data); if(m.type==='reset') render([]); if(m.type==='update') render(m.sequence); };
  es.onerror   = ()=>{ dot.className='err'; };
}
function reconnect() { connect(); }
connect();

// ── Click-through: only interactive elements and resize edges capture mouse ──
const RESIZE_EDGE = 8; // px from window border treated as resize zone
let ignoring = true;

document.addEventListener('mousemove', e => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const x = e.clientX;
    const y = e.clientY;

    const nearEdge = x <= RESIZE_EDGE || y <= RESIZE_EDGE ||
                     x >= w - RESIZE_EDGE || y >= h - RESIZE_EDGE;

    const el = document.elementFromPoint(x, y);
    const interactive = el && (
        el.closest('.sbtn') ||
        el.closest('#resetBtn') ||
        el.closest('#closeBtn') ||
        el.closest('#bar')
    );

    const shouldIgnore = !(interactive || nearEdge);
    if (shouldIgnore !== ignoring) {
        ignoring = shouldIgnore;
        ipcRenderer.send('set-ignore-mouse', ignoring);
    }
});

document.addEventListener('mouseleave', () => {
    if (!ignoring) {
        ignoring = true;
        ipcRenderer.send('set-ignore-mouse', true);
    }
});
</script>
</body>
</html>
