<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Assist</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a12; color: #ddd;
    font-family: "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
    align-items: center; padding: 28px 16px; gap: 22px; min-height: 100vh;
  }
  h1 { font-size: 1.25rem; letter-spacing: .14em; color: #aab8ff; text-transform: uppercase; }
  #room-info { font-size: .65rem; color: #556; letter-spacing: .06em; }
  #room-info span { color: #8890cc; font-weight: 600; }
  #strip { display: flex; gap: 10px; }
  .sslot {
    width: 68px; height: 68px; border-radius: 6px;
    border: 2px solid #2a2a3a; background: #0e0e1a;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; position: relative; transition: border-color .25s, background .25s, box-shadow .25s;
  }
  .sslot .snum { position: absolute; top: 3px; left: 6px; font-size: .6rem; color: #444; }
  .sslot img   { width: 36px; height: 36px; opacity: 0; transition: opacity .3s; }
  .sslot .slbl { font-size: .58rem; text-transform: uppercase; letter-spacing: .05em; color: #555; opacity: 0; transition: opacity .3s; }
  .sslot.filled { border-color: var(--c); background: color-mix(in srgb,var(--c) 12%,#0e0e1a); box-shadow: 0 0 14px color-mix(in srgb,var(--c) 28%,transparent); }
  .sslot.filled img, .sslot.filled .slbl { opacity: 1; }
  .sslot.filled .slbl { color: var(--c); }

  #diag {
    position: relative; width: 260px; height: 260px;
    background: #0d0d18; border-radius: 50%;
    border: 2px solid #2a2a4a; box-shadow: 0 0 28px rgba(80,60,140,.35);
  }
  #boss {
    position: absolute; width: 40px; height: 40px;
    left: 50%; top: 50%; transform: translate(-50%,-50%);
    background: #c03030; border-radius: 50%; box-shadow: 0 0 12px rgba(200,50,50,.55);
  }
  #tank {
    position: absolute; display: flex; flex-direction: column; align-items: center; gap: 1px;
    transform: translate(-50%,-50%);
  }
  #tank img  { width: 20px; height: 20px; }
  #tank span { font-size: .52rem; color: #80b8ff; }
  .dslot {
    position: absolute; width: 46px; height: 46px;
    transform: translate(-50%,-50%); border-radius: 7px;
    border: 2px solid #2a2a3a; background: #12121e;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1px;
    transition: border-color .25s, background .25s, box-shadow .25s;
  }
  .dslot .dnum {
    font-size: 1rem; font-weight: 800; color: #2e2e50;
    line-height: 1; transition: color .2s, font-size .2s; letter-spacing: -.02em;
  }
  .dslot img   { display: block; width: 0; height: 0; opacity: 0; transition: width .2s, height .2s, opacity .25s; }
  .dslot .dlbl { font-size: .42rem; text-transform: uppercase; color: #555; opacity: 0; transition: opacity .25s; letter-spacing: .04em; }
  .dslot.filled { border-color: var(--c); background: color-mix(in srgb,var(--c) 15%,#12121e); box-shadow: 0 0 10px color-mix(in srgb,var(--c) 35%,transparent); }
  .dslot.filled .dnum { color: var(--c); font-size: 1.2rem; }
  .dslot.filled img { width: 24px; height: 24px; opacity: 1; }
  .dslot.filled .dlbl { opacity: 1; color: var(--c); }

  #status {
    font-size: .72rem; padding: 3px 12px; border-radius: 20px;
    background: #111120; border: 1px solid #222236; color: #555;
    transition: color .3s, border-color .3s;
  }
  #status.connected { color: #4caf50; border-color: #4caf50; }
  #status.error     { color: #f44336; border-color: #f44336; }
</style>
</head>
<body>
<h1>Memory Assist</h1>
<div id="room-info">Room: <span id="room-name">default</span></div>
<div id="strip">
  <div class="sslot" id="ss1"><span class="snum">1</span><img src="" alt=""><span class="slbl"></span></div>
  <div class="sslot" id="ss2"><span class="snum">2</span><img src="" alt=""><span class="slbl"></span></div>
  <div class="sslot" id="ss3"><span class="snum">3</span><img src="" alt=""><span class="slbl"></span></div>
  <div class="sslot" id="ss4"><span class="snum">4</span><img src="" alt=""><span class="slbl"></span></div>
  <div class="sslot" id="ss5"><span class="snum">5</span><img src="" alt=""><span class="slbl"></span></div>
</div>
<div id="diag">
  <div id="boss"></div>
  <div id="tank"><img src="https://wow.zamimg.com/images/wow/icons/small/inv_shield_06.jpg" alt="" onerror="this.style.display='none'"><span>Tank</span></div>
  <div class="dslot" id="ds1"><span class="dnum">1</span><img src="" alt=""><span class="dlbl"></span></div>
  <div class="dslot" id="ds2"><span class="dnum">2</span><img src="" alt=""><span class="dlbl"></span></div>
  <div class="dslot" id="ds3"><span class="dnum">3</span><img src="" alt=""><span class="dlbl"></span></div>
  <div class="dslot" id="ds4"><span class="dnum">4</span><img src="" alt=""><span class="dlbl"></span></div>
  <div class="dslot" id="ds5"><span class="dnum">5</span><img src="" alt=""><span class="dlbl"></span></div>
</div>
<div id="status">Connecting...</div>
<script>
const SHAPES = [
  { name:"TRIANGLE", color:"#66ff88", img:"./Triangle.png" },
  { name:"DIAMOND",  color:"#ffd933", img:"./diamond.png"  },
  { name:"T",        color:"#cc80ff", img:"./T.png"        },
  { name:"CIRCLE",   color:"#66ccff", img:"./circle.png"   },
  { name:"X",        color:"#ff4d4d", img:"./x.png"        },
];
const MAP = Object.fromEntries(SHAPES.map(s=>[s.name,s]));
const DIAG_SIZE = 260;
const SLOT_R    = 101;
const TANK_R    = 112;
const SLOT_ANGLES = [150, 210, 270, 330, 30];
const dc = DIAG_SIZE / 2;
function polarXY(r, deg) {
  const rad = deg * Math.PI / 180;
  return { left: dc + r * Math.cos(rad), top: dc + r * Math.sin(rad) };
}
const ds = [1,2,3,4,5].map(i => document.getElementById("ds"+i));
SLOT_ANGLES.forEach((deg, i) => {
  const p = polarXY(SLOT_R, deg);
  ds[i].style.left = p.left.toFixed(1)+"px";
  ds[i].style.top  = p.top.toFixed(1)+"px";
});
const tankEl = document.getElementById("tank");
const tp = polarXY(TANK_R, 90);
tankEl.style.left = tp.left.toFixed(1)+"px";
tankEl.style.top  = tp.top.toFixed(1)+"px";

// ─────────────────────────────────────────────────────────────────────────────
// SERVER URL — change the production URL below if you are hosting your own
// instance of watcher.js instead of using the shared server.
// Deploy watcher.js to any Node host (Render, Railway, Fly.io, VPS…) and
// replace 'https://memoryassist.onrender.com' with your own URL.
// The localhost entry is used automatically when testing locally.
// ─────────────────────────────────────────────────────────────────────────────
const BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:8765'
  : 'https://memoryassist.onrender.com';

const roomId = new URLSearchParams(location.search).get('room') || 'default';
document.getElementById('room-name').textContent = roomId;

let es;
const ss = [1,2,3,4,5].map(i=>document.getElementById("ss"+i));
const st = document.getElementById("status");

function render(seq){
  ss.forEach((el,i)=>{
    const info = MAP[seq[i]];
    if(info){
      el.style.setProperty("--c",info.color);
      el.querySelector("img").src=info.img;
      const lb=el.querySelector(".slbl"); if(lb) lb.textContent=seq[i];
      el.classList.add("filled");
    } else {
      el.style.removeProperty("--c");
      el.querySelector("img").src="";
      const lb=el.querySelector(".slbl"); if(lb) lb.textContent="";
      el.classList.remove("filled");
    }
  });
  ds.forEach((el,i)=>{
    const info = MAP[seq[i]];
    if(info){
      el.style.setProperty("--c",info.color);
      el.querySelector("img").src=info.img;
      el.querySelector(".dlbl").textContent=info.name;
      el.classList.add("filled");
    } else {
      el.style.removeProperty("--c");
      el.querySelector("img").src="";
      el.querySelector(".dlbl").textContent="";
      el.classList.remove("filled");
    }
  });
}
function connect(){
  es=new EventSource(BASE+'/events?room='+encodeURIComponent(roomId));
  es.onopen=()=>{ st.textContent="Connected"; st.className="connected"; };
  es.onmessage=e=>{ const m=JSON.parse(e.data); if(m.type==="reset") render([]); if(m.type==="update") render(m.sequence); };
  es.onerror=()=>{ st.textContent="Disconnected - retrying..."; st.className="error"; };
}
connect();
</script>
</body>
</html>
